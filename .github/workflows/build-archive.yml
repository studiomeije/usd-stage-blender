name: Release Blender extension

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Bare release version matching blender_manifest.toml (for example 1.0.0)"
        required: true
        type: string
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-metadata:
    name: Validate release tag and branch ancestry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      archive_name: ${{ steps.metadata.outputs.archive_name }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      REQUESTED_EVENT: ${{ github.event_name }}
      REQUESTED_REF: ${{ github.ref }}
      REQUESTED_REF_TYPE: ${{ github.ref_type }}
      REQUESTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Blender scenes and USD assets are LFS-backed; without this the
          # checkout yields pointer files and the add-on ships a broken
          # nodegroups.blend while every .blend test fixture fails to open.
          lfs: true
          fetch-depth: 0

      - name: Validate bare tag and manifest version
        id: metadata
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be bare MAJOR.MINOR.PATCH without a v prefix: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$REQUESTED_REF" == "refs/heads/dev" ]]; then
            if [[ "$REQUESTED_EVENT" != "workflow_dispatch" || "$REQUESTED_REF_TYPE" != "branch" ]]; then
              echo "Only a manual dry run may use refs/heads/dev" >&2
              exit 1
            fi
          elif [[ "$REQUESTED_REF" == "refs/tags/$RELEASE_TAG" ]]; then
            if [[ "$REQUESTED_REF_TYPE" != "tag" ]]; then
              echo "Release ref must be presented as a tag" >&2
              exit 1
            fi
            case "$REQUESTED_EVENT" in
              push|workflow_dispatch) ;;
              *)
                echo "Unsupported release event: $REQUESTED_EVENT" >&2
                exit 1
                ;;
            esac
          else
            echo "Release validation is limited to refs/heads/dev or the exact release tag; got $REQUESTED_REF" >&2
            exit 1
          fi

          manifest_version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("Plugin/blender_manifest.toml").read_text())["version"])
          PY
          )"
          if [[ "$RELEASE_TAG" != "$manifest_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match manifest version $manifest_version" >&2
            exit 1
          fi

          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "archive_name=usd-stage-for-blender-${RELEASE_TAG}.zip" >> "$GITHUB_OUTPUT"

      - name: Require a release tag on main, or a dry run on dev
        run: |
          set -euo pipefail

          requested_commit="$(git rev-parse "${REQUESTED_SHA}^{commit}")"
          checked_out_commit="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$requested_commit" != "$checked_out_commit" ]]; then
            echo "Checked-out commit does not match requested SHA" >&2
            exit 1
          fi

          # Releases are tagged on main, which receives dev through merge
          # commits; a manual dry run checks dev itself.
          if [[ "$REQUESTED_REF_TYPE" == "tag" ]]; then
            release_branch=main
          else
            release_branch=dev
          fi
          git fetch --no-tags --force origin \
            "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
          git merge-base --is-ancestor \
            "$requested_commit" "refs/remotes/origin/${release_branch}"

          if [[ "$REQUESTED_REF_TYPE" == "tag" ]]; then
            git fetch --force origin \
              "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "$tag_commit" != "$requested_commit" ]]; then
              echo "Release ref does not resolve to the requested commit" >&2
              exit 1
            fi
          fi

  portable-quality-gates:
    name: Portable quality gates
    needs: validate-release-metadata
    uses: ./.github/workflows/ci.yml

  build-release-archive:
    name: Build tested release archive
    # Apple 27 verification is a manual gate: run scripts/verify_apple_platform.sh
    # on a Mac before tagging. It used to be a self-hosted workflow, but no such
    # runner is registered, so the job never ran - it queued for 24 hours and was
    # cancelled, while looking like a gate.
    needs:
      - validate-release-metadata
      - portable-quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ needs.validate-release-metadata.outputs.version }}
      archive_name: ${{ needs.validate-release-metadata.outputs.archive_name }}
    env:
      RELEASE_TAG: ${{ needs.validate-release-metadata.outputs.version }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Blender scenes and USD assets are LFS-backed; without this the
          # checkout yields pointer files and the add-on ships a broken
          # nodegroups.blend while every .blend test fixture fails to open.
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build and verify the deterministic release bundle
        run: |
          python3 scripts/release_archive.py --check --expected-tag "$RELEASE_TAG"
          archive_name="usd-stage-for-blender-${RELEASE_TAG}.zip"
          test -s "dist/$archive_name"
          test -s "dist/$archive_name.sha256"
          (cd dist && sha256sum --check "$archive_name.sha256")

      - name: Upload tested release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usd-stage-for-blender-${{ needs.validate-release-metadata.outputs.version }}-release
          path: |
            dist/${{ needs.validate-release-metadata.outputs.archive_name }}
            dist/${{ needs.validate-release-metadata.outputs.archive_name }}.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build-release-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Blender scenes and USD assets are LFS-backed; without this the
          # checkout yields pointer files and the add-on ships a broken
          # nodegroups.blend while every .blend test fixture fails to open.
          lfs: true
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download exact tested release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: usd-stage-for-blender-${{ needs.build-release-archive.outputs.version }}-release
          path: dist

      - name: Verify downloaded checksum
        working-directory: dist
        run: sha256sum --check "${{ needs.build-release-archive.outputs.archive_name }}.sha256"

      - name: Revalidate release tag immediately before publication
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ needs.build-release-archive.outputs.version }}"
          git fetch --force origin \
            "+refs/tags/${release_tag}:refs/tags/${release_tag}"
          tag_commit="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag moved after validation: expected $GITHUB_SHA, got $tag_commit" >&2
            exit 1
          fi

      - name: Publish release and assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build-release-archive.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ needs.build-release-archive.outputs.archive_name }}
            dist/${{ needs.build-release-archive.outputs.archive_name }}.sha256
