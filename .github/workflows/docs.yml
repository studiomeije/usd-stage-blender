name: Docs

# Builds the documentation site on every pull request that touches it, so a
# broken link or anchor fails the PR, and publishes it to GitHub Pages from
# main. Pages must be set to deploy from GitHub Actions in the repository
# settings.
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "mkdocs.yml"
      - "scripts/docs_site.py"
      - "scripts/tests/test_docs_site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # A newer push supersedes a pull request build, but a deploy runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  MKDOCS_VERSION: "1.6.1"
  MKDOCS_MATERIAL_VERSION: "9.6.14"

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Screenshots and the logo are LFS-backed; without this the site
          # would publish pointer files in place of every image.
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mkdocs==${MKDOCS_VERSION}" \
            "mkdocs-material==${MKDOCS_MATERIAL_VERSION}"

      - name: Build site
        run: mkdocs build --strict

      - name: Upload site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
